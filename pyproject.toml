[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent_cot_illegibility"
version = "0.1.0"
description = "Protocol-faithful first-stage textual reasoning model-organism construction"
readme = "readme.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5", "scipy==1.16.3", "PyYAML==6.0.3", "jsonschema==4.25.1",
  "requests==2.32.5", "httpx==0.28.1", "huggingface-hub==0.36.0", "datasets==4.4.1",
  "google-api-python-client==2.187.0", "google-auth-oauthlib==1.2.3", "matplotlib==3.10.7"
]

[project.optional-dependencies]
gpu = ["torch==2.9.0", "transformers==4.57.3", "peft==0.18.0", "bitsandbytes==0.48.2", "accelerate==1.12.0", "trl==0.26.2", "cut-cross-entropy @ git+https://github.com/apple/ml-cross-entropy.git@3de376c106a1916bc5e1b619f9c77c87a461ee1c"]
test = ["pytest==8.3.5", "setuptools==80.9.0", "wheel==0.45.1"]
kazitext = ["ufal.udpipe==1.3.1.1", "aspell-python-py3==1.15", "Unidecode==1.0.22"]

[project.scripts]
illegibility = "experiment_overview.experiment_overview:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --import-mode=importlib"
markers = ["live: requires explicitly authorized external resources", "gpu: requires CUDA hardware", "statistical: full prospective Monte Carlo validation"]
